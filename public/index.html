<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PI Project Management</title>
<link rel="icon" type="image/svg+xml" href="/cosmax-mark.svg">
<style>
:root{color-scheme:light;--bg:#f4f4f6;--card:#ffffff;--sidebar:#ffffff;--text:#0f172a;--fg:#0f172a;--muted:#64748b;--line:#e4e4e7;--pri:#ed1c24;--soft:#f8fafc;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--r:12px}
[data-theme=dark]{color-scheme:dark;--bg:#09090b;--card:#121215;--sidebar:#0d0d10;--text:#f4f4f5;--fg:#f4f4f5;--muted:#a1a1aa;--line:#27272e;--soft:#18181c;--pri:#ed1c24}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;background-color:var(--bg);color:var(--text);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]),select,textarea{background-color:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]):focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 2px rgba(237,28,36,.18)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
select option,select optgroup{background-color:var(--card);color:var(--text)}
input:disabled,select:disabled,textarea:disabled{opacity:.65;cursor:not-allowed;background-color:var(--soft)!important;color:var(--muted)!important}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,input:-webkit-autofill:active,textarea:-webkit-autofill,select:-webkit-autofill{-webkit-text-fill-color:var(--text)!important;-webkit-box-shadow:0 0 0 1000px var(--card) inset!important;box-shadow:0 0 0 1000px var(--card) inset!important;background-color:var(--card)!important;color:var(--text)!important;caret-color:var(--text)!important;transition:background-color 99999s ease-out 0s}

/* Cosmax Enterprise App Shell */
.app-shell{display:flex;min-height:100vh;width:100%}
.app-sidebar{width:252px;flex:none;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30;user-select:none;transition:transform .2s ease,width .2s ease}
.sb-brand{display:flex;align-items:center;gap:11px;padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;border-radius:8px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.02em;flex:none;box-shadow:0 4px 12px rgba(237,28,36,.28)}
.sb-brand b{display:block;font-size:13.5px;font-weight:700;line-height:1.2;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-brand small{display:block;font-size:11px;color:var(--muted)}
.sb-scroll{flex:1;overflow-y:auto;padding:10px 10px 16px}
.sb-group{margin-bottom:14px}
.sb-label{font-size:11px;font-weight:600;color:var(--muted);padding:4px 10px 6px;letter-spacing:.02em}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--text);padding:8px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;text-align:left;margin-bottom:2px;transition:background .15s,color .15s}
.sb-item svg{width:16px;height:16px;flex:none;opacity:.8}
.sb-item:hover{background:var(--soft)}
.sb-item.on{background:var(--pri);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(237,28,36,.22)}
.sb-item.on svg{opacity:1}
.sb-badge{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.sb-item.on .sb-badge{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}
.sb-foot{padding:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--sidebar)}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--text);flex:none}
.sb-user{flex:1;min-width:0;cursor:pointer}
.sb-user b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-icon-btn{border:1px solid var(--line);background:var(--card);color:var(--muted);width:30px;height:30px;border-radius:7px;display:grid;place-items:center;cursor:pointer;flex:none}
.sb-icon-btn:hover{color:var(--text);background:var(--soft)}

.app-main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
header.app-topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 24px;background:var(--sidebar);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.tb-toggle{display:grid;border:1px solid var(--line);background:var(--card);color:var(--muted);width:36px;height:36px;border-radius:8px;cursor:pointer;place-items:center;font-size:18px;flex:none}
.tb-toggle:hover{background:var(--soft);color:var(--text)}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.crumbs b{color:var(--text);font-weight:600}
.crumbs .sep{opacity:.45;font-size:12px}
.crumbs .crumb-link{cursor:pointer;color:var(--muted)}.crumbs .crumb-link:hover{color:var(--text);text-decoration:underline}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lang-pills{display:inline-flex;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang-pills button{border:0;background:transparent;color:var(--muted);padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;cursor:pointer;transition:.15s}
.lang-pills button.on{background:var(--pri);color:#fff}

/* Page Headings & Workspace */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.page-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.page-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* KPI Cards Cosmax Style */
.kpi-icon{position:absolute;top:12px;right:14px;color:var(--muted);opacity:.65;font-size:15px}

/* Stepper, Stage Pipeline & Task Progress (Cosmax Style) */
.wiz-wrap{max-width:1120px;margin:0 auto}
.wiz-top,.wiz-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.wiz-head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.wiz-head p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.wiz-step-counter,.wiz-step-count{font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:600}
.wiz-stepper{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:6px}
.wiz-node{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:105px;position:relative;cursor:pointer;text-align:center}
.wiz-node:not(:last-child)::after{content:'';position:absolute;top:16px;left:calc(50% + 22px);right:calc(-50% + 22px);height:1.5px;background:var(--line);z-index:1}
.wiz-node.done:not(:last-child)::after{background:rgba(237,28,36,.55)}
.wiz-circle{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--muted);position:relative;z-index:2;transition:.15s}
.wiz-node.done .wiz-circle{border-color:var(--pri);color:var(--pri);background:rgba(237,28,36,.12)}
.wiz-node.active .wiz-circle{border-color:var(--pri);background:var(--pri);color:#fff;box-shadow:0 0 0 4px rgba(237,28,36,.18)}
.wiz-node.late .wiz-circle,.wiz-node.delayed .wiz-circle{border-color:var(--bad);background:rgba(239,68,68,.15);color:var(--bad)}
.wiz-title,.wiz-label{font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.25;max-width:135px}
.wiz-node.active .wiz-title,.wiz-node.done .wiz-title,.wiz-node.active .wiz-label,.wiz-node.done .wiz-label{color:var(--text)}
.wiz-sub{font-size:10.5px;color:var(--muted);line-height:1.2}
.wiz-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.wiz-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.wiz-foot .l{margin-right:auto}

/* Detail Grid, Sub-Tabs & Quick Task Progress */
.out-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:10px;margin-bottom:14px}
.out-kv{padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.out-kv small{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.out-kv b{font-size:14px;display:block;word-break:break-word}
.out-section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.out-section h4{margin:0 0 10px;font-size:13.5px}
.out-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.out-section-head h3{margin:0;font-size:15px}
.mode-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--soft);color:var(--muted)}
.mode-pill.output{border-color:rgba(16,185,129,.35);color:#10b981;background:rgba(16,185,129,.08)}
.mode-pill.input{border-color:rgba(237,28,36,.4);color:var(--pri);background:rgba(237,28,36,.1)}
.c2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.banner.ok{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.35);color:#10b981}
.sub-tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px;overflow-x:auto;flex-wrap:wrap}
.sub-tabs button{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.sub-tabs button:hover{background:var(--soft);color:var(--text)}
.sub-tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.task-prog-box{display:flex;align-items:center;gap:8px;min-width:170px}
.task-prog-box input[type=range]{flex:1;min-width:75px;accent-color:var(--pri);cursor:pointer;padding:0;margin:0}
.task-prog-box input[type=number]{width:54px!important;padding:4px 6px!important;text-align:right;font-weight:700;font-size:12px!important;margin:0!important}
.task-qbtns{display:inline-flex;gap:4px;align-items:center}
.task-qbtns button{border:1px solid var(--line);background:var(--soft);color:var(--muted);padding:3px 7px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer}
.task-qbtns button:hover{color:var(--text);border-color:var(--muted)}
.task-qbtns button.done-btn{border-color:rgba(16,185,129,.45);color:#10b981;background:rgba(16,185,129,.08)}

.reminder-period{display:flex;gap:4px;margin:0}.reminder-period button{border:1px solid var(--line);background:var(--card);padding:5px 10px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}.reminder-period button.on{background:var(--pri);border-color:var(--pri);color:#fff}.priority-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.imp-row{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(180px,1.3fr) minmax(140px,.8fr) 150px 130px auto;gap:12px;align-items:center}.imp-row:last-child{border-bottom:0}.imp-row:hover{background:var(--soft)}.imp-desc{white-space:normal;color:var(--muted);font-size:12px}
.imp-attachments{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.imp-attachment{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--soft);min-width:0}.imp-attachment img{width:64px;height:48px;object-fit:cover;border-radius:4px;background:var(--card)}.imp-attachment-name{min-width:0;overflow-wrap:anywhere}.imp-link{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.stage-doc-list{display:grid;gap:8px}.stage-doc{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}.stage-doc-preview{width:100px;height:72px;display:grid;place-items:center;background:var(--card);border-radius:6px;overflow:hidden}.stage-doc-preview img,.stage-doc-preview video{width:100%;height:100%;object-fit:contain}.stage-doc-info,.stage-doc-link-info{min-width:0;overflow-wrap:anywhere}.stage-doc-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.stage-doc-purpose{display:grid;gap:5px;margin-top:8px}.stage-doc-purpose small,.stage-doc-purpose label{font-size:11px;color:var(--muted)}.stage-doc-purpose p{margin:3px 0 0;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.stage-doc-purpose textarea{display:block;width:100%;resize:vertical;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text);font:inherit;font-size:12px}.doc-description-status{display:inline-flex;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700}.doc-description-status.complete{background:rgba(16,185,129,.14);color:var(--ok)}.doc-description-status.missing{background:rgba(245,158,11,.16);color:#b45309}.doc-description-missing{color:#b45309;font-weight:600}.stage-doc-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.stage-doc-upload{display:inline-flex!important;align-items:center;gap:8px}.stage-doc-upload input{display:none}.stage-doc-link{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}.stage-doc-url{display:block;margin-top:4px;overflow-wrap:anywhere}.stage-doc-upload-form{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:8px;margin-bottom:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}.stage-doc-upload-form>label:first-child,.stage-doc-link-form label{display:grid;gap:4px;font-size:11px;color:var(--muted)}.stage-doc-upload-form textarea,.stage-doc-link-form textarea,.stage-doc-link-form input{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text);font:inherit;font-size:12px}.stage-doc-upload-form textarea,.stage-doc-link-form textarea{resize:vertical}.stage-doc-upload-form .small{grid-column:1/-1}.stage-doc-link-form{display:grid;grid-template-columns:minmax(150px,.8fr) minmax(200px,1.2fr);gap:8px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}.stage-doc-link-form .stage-doc-link-description{grid-column:1/-1}
.stage-doc-rich{grid-template-columns:minmax(0,1fr)}.stage-doc-rich .stage-doc-preview{width:100%;height:210px}.stage-doc-image-open{display:grid;width:100%;height:100%;place-items:center;padding:0;border:0;background:transparent;cursor:zoom-in}.stage-doc-image-open img{width:100%;height:100%;object-fit:contain}.stage-doc-rich .stage-doc-video{width:100%;height:210px;background:#000;object-fit:contain}.stage-doc-rich .stage-doc-preview-pdf{height:clamp(320px,55vh,620px);background:#343434}.stage-pdf-preview{display:block;width:100%;height:100%;overflow:auto;padding:12px;overscroll-behavior:contain;scrollbar-gutter:stable}.stage-pdf-page{position:relative;width:min(100%,1000px);margin:0 auto 12px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.35)}.stage-pdf-page canvas{display:block;width:100%;height:100%}.stage-doc-rich .stage-doc-preview-docx{height:auto;max-height:clamp(320px,55vh,620px);display:block;overflow:auto;padding:12px;background:#f1f5f9;color:#111;overscroll-behavior:contain}.stage-docx-preview .docx-wrapper{min-height:100%;padding:0!important;background:transparent!important}.stage-docx-preview .docx{margin:0 auto 12px!important;box-shadow:0 1px 5px rgba(15,23,42,.2)}.stage-docx-preview a{pointer-events:none;color:inherit;text-decoration:none}.stage-doc-speed{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:11px;color:var(--muted)}.stage-doc-speed select,.stage-media-speed select{width:auto;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text)}.stage-doc-rich .stage-doc-actions{justify-content:flex-start}.stage-media-overlay{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.82)}.stage-media-dialog{display:grid;grid-template-rows:auto minmax(0,1fr) auto;width:min(1100px,100%);max-height:min(92vh,950px);border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 20px 70px rgba(0,0,0,.5);overflow:hidden}.stage-media-header,.stage-media-footer{display:flex;align-items:center;gap:12px;padding:12px 16px}.stage-media-header{border-bottom:1px solid var(--line)}.stage-media-header>div{display:grid;gap:4px;min-width:0;flex:1}.stage-media-header b,.stage-media-header small{overflow-wrap:anywhere}.stage-media-header small{color:var(--muted)}.stage-media-content{display:grid;place-items:center;min-height:0;padding:10px;overflow:auto;background:#08090c}.stage-media-content>video{width:100%;max-height:68vh;background:#000}.stage-media-image-viewport{display:grid;place-items:center;min-width:100%;min-height:100%;overflow:auto}.stage-media-image-viewport img{max-width:min(100%,1000px);max-height:68vh;object-fit:contain;transform-origin:center;transition:transform .15s ease}.stage-media-footer{justify-content:space-between;border-top:1px solid var(--line)}.stage-media-zoom{display:flex;align-items:center;gap:7px}.stage-media-zoom span{min-width:42px;text-align:center;font-size:11px;color:var(--muted)}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--soft)}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{opacity:.9}
.btn.bad{color:var(--bad);border-color:var(--bad)}.btn.sm{padding:4px 9px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}
.sync{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:7px;max-width:340px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--ok)}.sync.warn i{background:var(--warn)}.sync.err i{background:var(--bad)}
.filters{display:flex;gap:8px;padding:12px 20px 0;flex-wrap:wrap;align-items:center}
.filters input,.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.filters #q{width:280px}
#cnt{color:var(--muted);font-size:12px;margin-left:auto}
main{padding:14px 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(135px,1fr));margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;position:relative;overflow:hidden}
.kpi i{position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi b{display:block;font-size:26px;line-height:1.1}.kpi span{color:var(--muted);font-size:12px}.kpi small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.kpi.on{outline:2px solid var(--pri)}.kpi.static{cursor:default}
.kpi .mini{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}.kpi .mini div{height:100%;background:var(--pri)}
.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-bottom:12px}
h3{margin:0 0 10px;font-size:14px}h4{margin:14px 0 8px;font-size:13px}
.donut{display:flex;align-items:center;gap:14px}.donut svg{width:140px;height:140px;flex:none}
.leg{display:grid;gap:5px;font-size:13px;flex:1}.leg div{display:flex;align-items:center;gap:7px;cursor:pointer}.leg i{width:10px;height:10px;border-radius:3px}.leg b{margin-left:auto}
.att{max-height:240px;overflow:auto;display:grid;gap:6px}
.ai{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px}
.ai:hover{background:var(--soft)}.tag{font-size:10.5px;font-weight:700;color:#fff;padding:2px 7px;border-radius:5px;white-space:nowrap}

        <button class="btn sm" id="theme-toggle" data-on-click="[&quot;toggleTheme&quot;]" title="Ubah Tema Terang / Gelap">☾</button>
        <div class="lang-pills" data-no-translate>
          <button type="button" data-lang="id" data-on-click="[&quot;setLanguage&quot;,&quot;id&quot;]">ID</button>
          <button type="button" data-lang="en" data-on-click="[&quot;setLanguage&quot;,&quot;en&quot;]">EN</button>
          <button type="button" data-lang="ko" data-on-click="[&quot;setLanguage&quot;,&quot;ko&quot;]">한국어</button>
        </div>
        <select id="app-language" hidden aria-label="Bahasa aplikasi" data-no-translate data-on-change="[&quot;setLanguage&quot;,&quot;@value&quot;]">
          <option value="id">Indonesia</option>
          <option value="en">English</option>
          <option value="ko">한국어</option>
        </select>
      </div>
    </header>

    <div class="filters">
      <input id="q" placeholder="Cari project, vendor, PIC, No. PO, stage..." data-on-input="[&quot;setFq&quot;,&quot;@value&quot;]">
      <span id="fsel"></span>
      <button class="btn sm" data-on-click="[&quot;resetF&quot;]">Reset filter</button>
      <div id="dashboard-date-slot" class="dashboard-date-slot" hidden></div>
      <span id="cnt"></span>
    </div>

    <main id="main"></main>
  </div>
</div>
<datalist id="vlist"></datalist>
<div id="modal"></div>
<div id="modal2"></div>
<div id="toast"></div>

<script src="/shared.js"></script>
<script src="/lib/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
