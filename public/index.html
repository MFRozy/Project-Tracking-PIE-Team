<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PI Project Management</title>
<style>
:root{--bg:#f4f4f6;--card:#ffffff;--sidebar:#ffffff;--text:#0f172a;--muted:#64748b;--line:#e4e4e7;--pri:#ed1c24;--soft:#f8fafc;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--r:12px}
[data-theme=dark]{--bg:#09090b;--card:#121215;--sidebar:#0d0d10;--text:#f4f4f5;--muted:#a1a1aa;--line:#232329;--soft:#18181c;--pri:#ed1c24}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;background-color:var(--bg);color:var(--text);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}

/* Cosmax Enterprise App Shell */
.app-shell{display:flex;min-height:100vh;width:100%}
.app-sidebar{width:252px;flex:none;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30;user-select:none;transition:transform .2s ease}
.sb-brand{display:flex;align-items:center;gap:11px;padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;border-radius:8px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.02em;flex:none;box-shadow:0 4px 12px rgba(237,28,36,.28)}
.sb-brand b{display:block;font-size:13.5px;font-weight:700;line-height:1.2;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-brand small{display:block;font-size:11px;color:var(--muted)}
.sb-scroll{flex:1;overflow-y:auto;padding:10px 10px 16px}
.sb-group{margin-bottom:14px}
.sb-label{font-size:11px;font-weight:600;color:var(--muted);padding:4px 10px 6px;letter-spacing:.02em}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--text);padding:8px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;text-align:left;margin-bottom:2px;transition:background .15s,color .15s}
.sb-item svg{width:16px;height:16px;flex:none;opacity:.8}
.sb-item:hover{background:var(--soft)}
.sb-item.on{background:var(--pri);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(237,28,36,.22)}
.sb-item.on svg{opacity:1}
.sb-badge{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.sb-item.on .sb-badge{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}
.sb-foot{padding:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--sidebar)}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--text);flex:none}
.sb-user{flex:1;min-width:0;cursor:pointer}
.sb-user b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-icon-btn{border:1px solid var(--line);background:var(--card);color:var(--muted);width:30px;height:30px;border-radius:7px;display:grid;place-items:center;cursor:pointer;flex:none}
.sb-icon-btn:hover{color:var(--text);background:var(--soft)}

.app-main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
header.app-topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 24px;background:var(--sidebar);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.tb-toggle{display:none;border:1px solid var(--line);background:var(--card);width:32px;height:32px;border-radius:8px;cursor:pointer;place-items:center}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.crumbs b{color:var(--text);font-weight:600}
.crumbs .sep{opacity:.45;font-size:12px}
.crumbs .crumb-link{cursor:pointer;color:var(--muted)}.crumbs .crumb-link:hover{color:var(--text);text-decoration:underline}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lang-pills{display:inline-flex;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang-pills button{border:0;background:transparent;color:var(--muted);padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;cursor:pointer;transition:.15s}
.lang-pills button.on{background:var(--pri);color:#fff}

/* Page Headings & Workspace */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.page-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.page-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* KPI Cards Cosmax Style */
.kpi-icon{position:absolute;top:12px;right:14px;color:var(--muted);opacity:.65;font-size:15px}

/* Stepper, Stage Pipeline & Task Progress (Cosmax Style) */
.wiz-wrap{max-width:1120px;margin:0 auto}
.wiz-top,.wiz-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.wiz-head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.wiz-head p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.wiz-step-counter,.wiz-step-count{font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:600}
.wiz-stepper{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:6px}
.wiz-node{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:105px;position:relative;cursor:pointer;text-align:center}
.wiz-node:not(:last-child)::after{content:'';position:absolute;top:16px;left:calc(50% + 22px);right:calc(-50% + 22px);height:1.5px;background:var(--line);z-index:1}
.wiz-node.done:not(:last-child)::after{background:rgba(237,28,36,.55)}
.wiz-circle{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--muted);position:relative;z-index:2;transition:.15s}
.wiz-node.done .wiz-circle{border-color:var(--pri);color:var(--pri);background:rgba(237,28,36,.12)}
.wiz-node.active .wiz-circle{border-color:var(--pri);background:var(--pri);color:#fff;box-shadow:0 0 0 4px rgba(237,28,36,.18)}
.wiz-node.late .wiz-circle,.wiz-node.delayed .wiz-circle{border-color:var(--bad);background:rgba(239,68,68,.15);color:var(--bad)}
.wiz-title,.wiz-label{font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.25;max-width:135px}
.wiz-node.active .wiz-title,.wiz-node.done .wiz-title,.wiz-node.active .wiz-label,.wiz-node.done .wiz-label{color:var(--text)}
.wiz-sub{font-size:10.5px;color:var(--muted);line-height:1.2}
.wiz-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.wiz-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.wiz-foot .l{margin-right:auto}

/* Detail Grid, Sub-Tabs & Quick Task Progress */
.out-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:10px;margin-bottom:14px}
.out-kv{padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.out-kv small{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.out-kv b{font-size:14px;display:block;word-break:break-word}
.out-section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.out-section h4{margin:0 0 10px;font-size:13.5px}
.out-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.out-section-head h3{margin:0;font-size:15px}
.mode-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--soft);color:var(--muted)}
.mode-pill.output{border-color:rgba(16,185,129,.35);color:#10b981;background:rgba(16,185,129,.08)}
.mode-pill.input{border-color:rgba(237,28,36,.4);color:var(--pri);background:rgba(237,28,36,.1)}
.c2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.banner.ok{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.35);color:#10b981}
.sub-tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px;overflow-x:auto;flex-wrap:wrap}
.sub-tabs button{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.sub-tabs button:hover{background:var(--soft);color:var(--text)}
.sub-tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.task-prog-box{display:flex;align-items:center;gap:8px;min-width:170px}
.task-prog-box input[type=range]{flex:1;min-width:75px;accent-color:var(--pri);cursor:pointer;padding:0;margin:0}
.task-prog-box input[type=number]{width:54px!important;padding:4px 6px!important;text-align:right;font-weight:700;font-size:12px!important;margin:0!important}
.task-qbtns{display:inline-flex;gap:4px;align-items:center}
.task-qbtns button{border:1px solid var(--line);background:var(--soft);color:var(--muted);padding:3px 7px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer}
.task-qbtns button:hover{color:var(--text);border-color:var(--muted)}
.task-qbtns button.done-btn{border-color:rgba(16,185,129,.45);color:#10b981;background:rgba(16,185,129,.08)}

.reminder-period{display:flex;gap:4px;margin:0}.reminder-period button{border:1px solid var(--line);background:var(--card);padding:5px 10px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}.reminder-period button.on{background:var(--pri);border-color:var(--pri);color:#fff}.priority-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.imp-row{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(180px,1.3fr) minmax(140px,.8fr) 150px 130px auto;gap:12px;align-items:center}.imp-row:last-child{border-bottom:0}.imp-row:hover{background:var(--soft)}.imp-desc{white-space:normal;color:var(--muted);font-size:12px}
.imp-attachments{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.imp-attachment{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--soft);min-width:0}.imp-attachment img{width:64px;height:48px;object-fit:cover;border-radius:4px;background:var(--card)}.imp-attachment-name{min-width:0;overflow-wrap:anywhere}.imp-link{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.stage-doc-list{display:grid;gap:8px}.stage-doc{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--soft)}.stage-doc-preview{width:120px;height:76px;display:grid;place-items:center;background:var(--card);border-radius:4px;overflow:hidden}.stage-doc-preview img,.stage-doc-preview video{width:100%;height:100%;object-fit:contain}.stage-doc-info{min-width:0;overflow-wrap:anywhere}.stage-doc-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.stage-doc-upload{display:inline-flex!important;align-items:center;gap:8px}.stage-doc-upload input{display:none}.stage-doc-link{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--soft)}.stage-doc-link-info{min-width:0;overflow-wrap:anywhere}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--soft)}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{opacity:.9}
.btn.bad{color:var(--bad);border-color:var(--bad)}.btn.sm{padding:4px 9px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}
.sync{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:7px;max-width:340px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--ok)}.sync.warn i{background:var(--warn)}.sync.err i{background:var(--bad)}
.filters{display:flex;gap:8px;padding:12px 20px 0;flex-wrap:wrap;align-items:center}
.filters input,.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.filters #q{width:280px}
#cnt{color:var(--muted);font-size:12px;margin-left:auto}
main{padding:14px 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(135px,1fr));margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;position:relative;overflow:hidden}
.kpi i{position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi b{display:block;font-size:26px;line-height:1.1}.kpi span{color:var(--muted);font-size:12px}.kpi small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.kpi.on{outline:2px solid var(--pri)}.kpi.static{cursor:default}
.kpi .mini{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}.kpi .mini div{height:100%;background:var(--pri)}
.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-bottom:12px}
h3{margin:0 0 10px;font-size:14px}h4{margin:14px 0 8px;font-size:13px}
.donut{display:flex;align-items:center;gap:14px}.donut svg{width:140px;height:140px;flex:none}
.leg{display:grid;gap:5px;font-size:13px;flex:1}.leg div{display:flex;align-items:center;gap:7px;cursor:pointer}.leg i{width:10px;height:10px;border-radius:3px}.leg b{margin-left:auto}
.att{max-height:240px;overflow:auto;display:grid;gap:6px}
.ai{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px}
.ai:hover{background:var(--soft)}.tag{font-size:10.5px;font-weight:700;color:#fff;padding:2px 7px;border-radius:5px;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:12px}
.pb{display:grid;grid-template-columns:minmax(230px,1.5fr) 2fr 130px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pb:last-child{border:0}.pb:hover{background:var(--soft)}
.bar{height:12px;background:var(--line);border-radius:6px;position:relative}
.bar .fill{height:100%;border-radius:6px}.bar .plan{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text)}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;font-weight:600;color:#fff}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:700;color:#fff;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.banner{padding:10px 14px;border-radius:var(--r);margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;border:1px solid var(--line)}
.banner.info{background:#fff1f2;border-color:#fecdd3;color:#9f1239}.banner.warn{background:#fffbeb;border-color:#fde68a;color:#78350f}
[data-theme=dark] .banner.info{background:#35171b;color:#ffc2c7;border-color:#71313a}[data-theme=dark] .banner.warn{background:#2c2410;color:#f7dd9a;border-color:#6b5316}
.banner .btn{margin-left:auto}
.tw{overflow:auto}table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--soft);text-align:left;font-size:12px;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}
.r{text-align:right}.empty{padding:30px;text-align:center;color:var(--muted)}
.pbar{display:inline-block;width:70px;height:7px;background:var(--line);border-radius:4px;vertical-align:middle;margin-right:6px;overflow:hidden}.pbar div{height:100%;background:var(--pri)}
/* gantt */
.gtool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;padding:10px 14px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;background:var(--card);padding:6px 12px;cursor:pointer;font-weight:600}.seg button.on{background:var(--pri);color:#fff}
.lg{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-left:auto;flex-wrap:wrap;align-items:center}.lg span{display:flex;align-items:center;gap:5px}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.gscroll{overflow:auto;max-height:calc(100vh - 250px);padding:0}
.gwrap{position:relative}
.ghead{display:flex;position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);height:49px}
.gcols{position:relative;height:48px}
.gseg{position:absolute;font-size:11px;color:var(--muted);padding:4px 6px;border-left:1px solid var(--line);overflow:hidden;white-space:nowrap;height:24px}
.gseg.t{top:0;font-weight:700;color:var(--text)}.gseg.b{top:24px;border-top:1px solid var(--line)}
.gl{position:sticky;left:0;width:270px;flex:none;background:var(--card);z-index:4;border-right:1px solid var(--line);padding:0 12px;display:flex;align-items:center;gap:8px;cursor:pointer;overflow:hidden}
.gcorner{font-size:12px;font-weight:700;color:var(--muted);cursor:default;z-index:7}
.grow{display:flex;height:42px;border-bottom:1px solid var(--line)}.grow:hover .gt{background:var(--soft)}
.ghd{background:var(--soft);height:30px}.ghd .gl{background:var(--soft);cursor:default}.ghd i{width:10px;height:10px;border-radius:3px}
.gn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}.gs{font-size:11px;color:var(--muted);white-space:nowrap}
.gt{position:relative;flex:none}
.gbar{position:absolute;top:10px;height:22px;border-radius:5px;border:1px solid;overflow:hidden;cursor:pointer}
.gbar div{height:100%}.gbar.late{outline:2px solid var(--bad);outline-offset:1px}.gbar.hold{border-style:dashed;opacity:.7}
.gpct{position:absolute;top:13px;font-size:11px;font-weight:700;color:var(--muted)}
.gms{position:absolute;top:15px;width:12px;height:12px;transform:rotate(45deg);background:var(--card);border:2px solid var(--text);z-index:2}.gms.done{background:var(--ok);border-color:var(--ok)}
.glines{position:absolute;top:0;bottom:0;pointer-events:none;z-index:1}
.glines div{position:absolute;top:49px;bottom:0;width:1px;background:var(--line);opacity:.7}
.glines .today{background:var(--bad);width:2px;opacity:1;z-index:3}
.gtodayh{position:absolute;top:27px;transform:translateX(-50%);background:var(--bad);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;z-index:3;white-space:nowrap}
/* budget view */
.brow{display:grid;grid-template-columns:minmax(200px,1fr) 3fr 190px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.brow:hover{background:var(--soft)}.btrack{position:relative;height:16px}
.bbud{position:absolute;left:0;top:0;bottom:0;border:1px solid var(--muted);background:var(--soft);border-radius:4px}
.bfill{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px}.blow{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--text)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto;z-index:50}
.dlg{background:var(--card);border-radius:12px;width:min(900px,100%);border:1px solid var(--line)}.dlg.sm{width:min(560px,100%)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}.dh h3{margin:0;font-size:16px;flex:1}
.x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);overflow:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}.tabs button.on{color:var(--pri);border-color:var(--pri)}
.db{padding:16px 18px;max-height:calc(100vh - 230px);overflow:auto}
.df{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);justify-content:flex-end}.df .l{margin-right:auto}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted)}label.full{grid-column:1/-1}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-weight:400;font-size:14px}
label input[type=range]{padding:0;border:0}
.num{text-align:right}.hint{display:block;color:var(--muted);font-weight:400;min-height:15px;text-align:right}
.prow{display:flex;gap:10px;align-items:center}.prow input[type=number]{width:80px}
.bsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.bsum div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--soft)}.bsum small{display:block;color:var(--muted);font-size:11px}.bsum b{font-size:15px}
.qh{display:flex;align-items:center;margin:16px 0 8px}.qh h4{margin:0;flex:1}
.qcard{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--soft)}.qcard.sel{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.project-group td{background:var(--soft);border-top:2px solid var(--line);font-weight:700;white-space:normal}.project-group .muted{font-weight:400}
.qnote{min-width:180px;max-width:320px;white-space:normal;overflow-wrap:anywhere;color:var(--muted);font-size:12px}.qnote details{margin-top:3px}.qnote summary{cursor:pointer;color:var(--pri);font-weight:600}.q-note-full{margin-top:4px;white-space:pre-wrap;color:var(--text)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.qfoot{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:12px}.qfoot .sp{flex:1}
.fchip{background:var(--card);border:1px solid var(--line);padding:3px 8px;border-radius:6px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msrow{display:grid;grid-template-columns:24px 1fr 160px 70px;gap:8px;align-items:center;margin-bottom:8px}
.msrow input[type=text],.msrow input[type=date]{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);width:100%}
.logi{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.logi small{color:var(--muted)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:8px;z-index:99;display:none;max-width:90vw;font-size:13px}
.catrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}.catrow input[type=text]{flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.catrow input[type=color]{width:38px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}

/* v3: stage, PO, template */
.strip{display:flex;gap:2px;margin-top:6px}.strip i{flex:1;height:7px;border-radius:2px;background:var(--line);min-width:3px}
.gx{display:inline-block;width:18px;text-align:center;cursor:pointer;color:var(--muted);font-size:13px;flex:none;user-select:none}
.gl>div{min-width:0}.gs{overflow:hidden;text-overflow:ellipsis;max-width:215px}
.grow.gsr{height:36px;background:var(--soft)}.gsr .gl{background:var(--soft);padding-left:34px}.gsr .gn{font-size:12px;font-weight:500;max-width:200px}
.gsr .gstage-heading{display:flex;align-items:center;gap:5px;max-width:230px;min-width:0}.gsr .gstage-heading>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gdoc{flex:none;border:1px solid var(--line);background:var(--card);color:var(--pri);border-radius:10px;padding:0 5px;height:18px;font-size:10px;line-height:16px;cursor:pointer}.gdoc:hover{background:var(--soft)}
.gsp{position:absolute;border:1px solid var(--muted);background:rgba(148,163,184,.25);border-radius:3px}.gsp.late{border-color:var(--bad);background:rgba(239,68,68,.15)}
.gsa{position:absolute;border-radius:3px;cursor:pointer}.gsa.run{border-right:3px dashed rgba(255,255,255,.75)}
.gdev{position:absolute;font-size:10.5px;font-weight:700;white-space:nowrap}
.stt{min-width:1040px}.stt th{cursor:default;position:static}.stt td{padding:4px 5px;white-space:nowrap}.stt input,.stt select{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:12.5px}
.stbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.stbar select,.stbar input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.porow{display:grid;grid-template-columns:170px 100px 1fr 150px auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--soft);font-size:13px}
.dlg.wide{width:min(1000px,100%)}#modal2 .ov{z-index:60}
.tplwrap{display:grid;grid-template-columns:230px 1fr;gap:14px}
.tpll .btn{display:block;width:100%;text-align:left;margin-bottom:4px}.tpll .btn.on{border-color:var(--pri);color:var(--pri)}
.strow{display:grid;grid-template-columns:26px 1fr 140px 70px 80px 120px;gap:6px;align-items:center;margin-bottom:6px}
.strow input[type=text],.strow input[type=number]{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);width:100%}
.itrow{display:grid;grid-template-columns:1fr 60px 70px 130px 120px 36px;gap:6px;margin-bottom:6px}
.sec{grid-column:1/-1;margin:8px 0 0;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);padding-bottom:4px}
.sgrow{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px}
.dlg select{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);width:100%}
.itrow input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);width:100%}
.deadline-reminders{margin-bottom:12px}.deadline-reminders .ai{align-items:center}.deadline-reminders.has-overdue{border-color:#fecaca}

.auth-card .auth-error{min-height:20px;color:#b42318;font-size:13px;margin:6px 0 0}.auth-note{padding:10px 12px;background:#fff8e6;border:1px solid #f4d58d;border-radius:7px;color:#70541b;font-size:13px;margin-bottom:14px}
.viewer-badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700;color:var(--muted)}

<script>
'use strict';
/* ================= util ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5;
let APP_LANG=['id','en','ko'].includes(localStorage.getItem('pt_language'))?localStorage.getItem('pt_language'):'id';
function today(){const d=new Date();d.setHours(0,0,0,0);return d;}
function pd(s){if(!s)return null;const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function fd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function diffDays(a,b){return Math.round((b-a)/DAY);}
function fmtDate(s){const d=pd(s),locale={id:'id-ID',en:'en-US',ko:'ko-KR'}[APP_LANG];return d?d.toLocaleDateString(locale,{day:'2-digit',month:'short',year:'numeric'}):'-';}
function fmtDT(ts){const locale={id:'id-ID',en:'en-US',ko:'ko-KR'}[APP_LANG];return new Date(ts).toLocaleString(locale,{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}
const SYMS={IDR:'Rp',USD:'US$',EUR:'€',JPY:'¥',SGD:'S$',KRW:'₩',CNY:'CN¥',THB:'฿',GBP:'£',AUD:'A$',MYR:'RM',INR:'₹'};
const sym=()=>SYMS[DB.settings.currency]||DB.settings.currency;
const loc=()=>APP_LANG==='ko'?'ko-KR':(DB.settings.currency==='IDR'&&APP_LANG==='id'?'id-ID':'en-US');
const fmtNum=n=>Number(n||0).toLocaleString(loc());
const money=n=>sym()+' '+fmtNum(n);
function poMoney(n,currency){const code=currency||DB.settings.currency||'IDR';let value;try{value=Number(n||0).toLocaleString(code==='IDR'?'id-ID':'en-US');}catch(e){value=fmtNum(n);}return (SYMS[code]||code)+' '+value;}
function moneyC(n){n=Number(n||0);let s;try{s=new Intl.NumberFormat(loc(),{notation:'compact',maximumFractionDigits:1}).format(n);}catch(e){s=fmtNum(n);}return sym()+' '+s;}
function quoteMoneyC(n,currency){n=Number(n||0);const code=currency||DB.settings.currency||'IDR';let s;try{s=new Intl.NumberFormat(code==='IDR'&&APP_LANG==='id'?'id-ID':({en:'en-US',ko:'ko-KR'}[APP_LANG]||'en-US'),{notation:'compact',maximumFractionDigits:1}).format(n);}catch(e){s=fmtNum(n);}return (SYMS[code]||code)+' '+s;}
const parseNum=s=>Number(String(s).replace(/[^\d]/g,''))||0;
const csvCell=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';

const LANG_SOURCE={};
Object.entries(LANG_TEXT).forEach(([source,values])=>{LANG_SOURCE[source]=source;Object.values(values).forEach(value=>{LANG_SOURCE[value]=source;});});
const LANG_VARIANTS=Object.keys(LANG_SOURCE).sort((a,b)=>b.length-a.length);
function translatedText(value){
  const trimmed=value.trim(),source=LANG_SOURCE[trimmed];
  if(source){
    const replacement=APP_LANG==='id'?source:(LANG_TEXT[source][APP_LANG]||source);
    return value.replace(trimmed,replacement);
  }
  let match=trimmed.match(/^(?:Perlu Perhatian|Needs Attention|확인 필요) \((\d+)\)$/);
  if(match)return value.replace(trimmed,APP_LANG==='id'?`Perlu Perhatian (${match[1]})`:APP_LANG==='en'?`Needs Attention (${match[1]})`:`확인 필요 (${match[1]})`);
  match=trimmed.match(/^(?:(\d+) dari (\d+) project|(\d+) of (\d+) projects|(\d+) \/ (\d+)개 프로젝트|(\d+) dari (\d+) issue|(\d+) of (\d+) issues|(\d+) \/ (\d+)개 이슈)$/);
  if(match){const first=match[1]||match[3]||match[5]||match[7]||match[9]||match[11],second=match[2]||match[4]||match[6]||match[8]||match[10]||match[12],isIssue=!!(match[7]||match[9]||match[11]);return value.replace(trimmed,APP_LANG==='id'?`${first} dari ${second} ${isIssue?'issue':'project'}`:APP_LANG==='en'?`${first} of ${second} ${isIssue?'issues':'projects'}`:`${first} / ${second}개 ${isIssue?'이슈':'프로젝트'}`);}
  match=trimmed.match(/^(?:(\d+) project belum ada quotation|(\d+) projects have no quotations|견적이 없는 프로젝트 (\d+)개)$/);
  if(match){const count=match[1]||match[2]||match[3];return value.replace(trimmed,APP_LANG==='id'?`${count} project belum ada quotation`:APP_LANG==='en'?`${count} projects have no quotations`:`견적이 없는 프로젝트 ${count}개`);}
  match=trimmed.match(/^(?:(\d+) quotation terpilih belum di-PO|(\d+) selected quotations have no PO yet|발주서가 없는 선정 견적 (\d+)개)$/);
  if(match){const count=match[1]||match[2]||match[3];return value.replace(trimmed,APP_LANG==='id'?`${count} quotation terpilih belum di-PO`:APP_LANG==='en'?`${count} selected quotations have no PO yet`:`발주서가 없는 선정 견적 ${count}개`);}
  match=trimmed.match(/^(?:Template stage|Stage templates|단계 템플릿) \((\d+)\)$/);
  if(match)return value.replace(trimmed,APP_LANG==='id'?`Template stage (${match[1]})`:APP_LANG==='en'?`Stage templates (${match[1]})`:`단계 템플릿 (${match[1]})`);
  match=trimmed.match(/^(\d+) hari lagi$/);
  if(match)return value.replace(trimmed,APP_LANG==='id'?`${match[1]} hari lagi`:APP_LANG==='en'?`${match[1]} days left`:`${match[1]}일 남음`);
  match=trimmed.match(/^Terlambat (\d+) hari$/);
  if(match)return value.replace(trimmed,APP_LANG==='id'?`Terlambat ${match[1]} hari`:APP_LANG==='en'?`${match[1]} days overdue`:`${match[1]}일 지연`);
  match=trimmed.match(/^(?:Langkah (\d+) dari (\d+)|Step (\d+) of (\d+)|(\d+)\/(\d+) 단계)$/);
  if(match){const s=match[1]||match[3]||match[5],t=match[2]||match[4]||match[6];return value.replace(trimmed,APP_LANG==='id'?`Langkah ${s} dari ${t}`:APP_LANG==='en'?`Step ${s} of ${t}`:`${s}/${t} 단계`);}

  let translated=value;
  LANG_VARIANTS.forEach(variant=>{
    if(!translated.includes(variant))return;
    const key=LANG_SOURCE[variant],replacement=APP_LANG==='id'?key:(LANG_TEXT[key][APP_LANG]||key);
    if(variant===replacement)return;
    const escaped=variant.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const matcher=new RegExp('(^|[^A-Za-z0-9])('+escaped+')(?=$|[^A-Za-z0-9])','g');
    translated=translated.replace(matcher,(_match,before)=>before+replacement);
  });
  return translated;
}
function applyLanguage(){
  document.documentElement.lang=APP_LANG;
  const selector=$('#app-language'),authSelector=$('#auth-language');if(selector)selector.value=APP_LANG;if(authSelector)authSelector.value=APP_LANG;
  document.querySelectorAll('.lang-pills button').forEach(btn=>btn.classList.toggle('on',btn.dataset.lang===APP_LANG));
  const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
  let node;
  while((node=walker.nextNode())){
    if(node.parentElement&&node.parentElement.closest('script,style,textarea,[data-no-translate]'))continue;
    node.nodeValue=translatedText(node.nodeValue);
  }
  document.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{
    ['placeholder','title','aria-label'].forEach(attr=>{if(el.hasAttribute(attr))el.setAttribute(attr,translatedText(el.getAttribute(attr)));});
  });
}
function setLanguage(language){
  if(!['id','en','ko'].includes(language))return;
  APP_LANG=language;localStorage.setItem('pt_language',language);
  const authSelector=$('#auth-language');if(authSelector)authSelector.value=language;
  render();applyLanguage();
}

function buildStages(defs,base){
  let cur=pd(base)||today(),prevS=cur;const out=[];
  defs.forEach(def=>{
    const days=Math.max(1,Number(def.days)||1);
    const ps=(def.par&&out.length)?prevS:cur;
    const pf=addDays(ps,days-1);
    out.push({id:uid(),name:def.name,pic:def.pic||'',ps:fd(ps),pf:fd(pf),as:'',af:'',status:'Not Started',prog:0,note:'',par:!!def.par});
    prevS=ps;const nx=addDays(pf,1);if(nx>cur)cur=nx;
  });
  return out;
}

function effStatus(p){
  if(p.status==='Completed'||p.progress>=100)return 'Completed';
  if(p.status==='On Hold')return 'On Hold';
  const e=pd(p.end);if(e&&e<today())return 'Delayed';
  return p.status;
}
function planned(p){const s=pd(p.start),e=pd(p.end);if(!s||!e)return 0;const t=today();if(t<=s)return 0;if(t>=e)return 100;return Math.round(diffDays(s,t)/Math.max(1,diffDays(s,e))*100);}
const atRisk=p=>effStatus(p)==='On Progress'&&planned(p)-p.progress>=15;
const quotes=p=>p.quotations||[];
const selQ=p=>quotes(p).find(q=>q.status==='Terpilih');
function lowQ(p){const a=quotes(p).filter(q=>q.status!=='Ditolak'&&q.amount>0);if(new Set(a.map(q=>q.currency||DB.settings.currency||'IDR')).size>1)return null;return a.length?a.reduce((m,q)=>q.amount<m.amount?q:m):null;}
function committed(p){if(p.actual>0)return p.actual;const s=selQ(p);return s&&s.amount>0&&(s.currency||DB.settings.currency||'IDR')===(DB.settings.currency||'IDR')?s.amount:0;}
function costBasis(p){
  if(p.actual>0)return {amt:p.actual,src:'Aktual / PO'};
  const s=selQ(p);if(s&&s.amount>0)return {amt:s.amount,src:'Quotation terpilih',currency:s.currency||DB.settings.currency||'IDR'};
  const l=lowQ(p);if(l)return {amt:l.amount,src:'Estimasi (quotation terendah)',currency:l.currency||DB.settings.currency||'IDR'};
  return {amt:0,src:''};
}
function budgetState(p){
  const b=p.budget||0,c=costBasis(p);
  if(!b)return {key:'nobudget',label:'Tanpa budget',color:'#94a3b8',c:c};
  if(c.currency&&(c.currency!==(DB.settings.currency||'IDR')))return {key:'currency',label:'Mata uang berbeda',color:'#94a3b8',c:{amt:0,src:c.src}};
  if(!c.amt)return {key:'noval',label:'Belum ada nilai',color:'#94a3b8',c:c};
  const r=c.amt/b;
  if(r>1)return {key:'over',label:'Over Budget',color:'#ef4444',c:c};
  if(r>=0.9)return {key:'near',label:'Mendekati budget',color:'#f59e0b',c:c};
  return {key:'safe',label:'Aman',color:'#10b981',c:c};
}

function stProg(s){
  if(s.af||s.status==='Completed')return 100;
  if(s.status==='Not Started'&&!s.as&&!(Number(s.prog)>0))return 0;
  const p=Number(s.prog);
  if(!isNaN(p)&&p>0)return Math.max(0,Math.min(100,Math.round(p)));
  return (s.as||s.status==='On Progress')?50:0;
}
function stEff(s){
  if(s.af||s.status==='Completed'||Number(s.prog)>=100)return 'Completed';
  if(s.status==='On Hold')return 'On Hold';
  const pf=pd(s.pf);if(pf&&pf<today())return 'Delayed';
  if(s.as||s.status==='On Progress'||Number(s.prog)>0)return 'On Progress';
  return 'Not Started';
}
function stLateStart(s){const e=stEff(s),ps=pd(s.ps);return e==='Not Started'&&ps&&ps<today();}
function stDev(s){const pf=pd(s.pf);if(!pf)return null;if(s.af)return diffDays(pf,pd(s.af));if(pf<today()&&stEff(s)!=='On Hold')return diffDays(pf,today());return null;}
function stageDays(s){return (s.ps&&s.pf)?Math.max(1,diffDays(pd(s.ps),pd(s.pf))+1):1;}
function stageCalc(p){
  const st=p.stages||[];if(!st.length)return null;
  let tot=0,done=0;st.forEach(s=>{const w=stageDays(s);tot+=w;done+=w*(stProg(s)/100);});
  return tot?Math.round(done/tot*100):0;
}
function applyAuto(p){
  const st=p.stages||[];if(!st.length)return;
  if(gset('autoDates')){
    let mn='',mx='';st.forEach(s=>{if(s.ps&&(!mn||s.ps<mn))mn=s.ps;if(s.pf&&(!mx||s.pf>mx))mx=s.pf;});
    if(mn)p.start=mn;if(mx)p.end=mx;
  }
  if(gset('autoProgress')){
    const v=stageCalc(p);p.progress=v;
    if(v>=100)p.status='Completed';
    else{
      if(p.status==='Completed')p.status='On Progress';
      if(p.status==='Not Started'&&(v>0||st.some(s=>s.as||s.af)))p.status='On Progress';
    }
  }
}
function curStage(p){
  const st=p.stages||[];if(!st.length)return null;
  const done=st.filter(s=>stEff(s)==='Completed').length;
  if(done===st.length)return {txt:'Semua tahap selesai',done:done,total:st.length,list:[]};
  let list=st.filter(s=>{const e=stEff(s);return e==='On Progress'||e==='Delayed'||e==='On Hold';});
  if(!list.length)list=[st.find(s=>stEff(s)==='Not Started')];
  return {txt:list.map(s=>s.name).join(' + '),done:done,total:st.length,list:list};
}
function stageStrip(p){
  const st=p.stages||[];if(!st.length)return '';
  return '<div class="strip">'+st.map(s=>{const e=stEff(s);return `<i style="background:${e==='Not Started'?'var(--line)':ST_COLOR[e]}" title="${esc(s.name+' · '+e)}"></i>`;}).join('')+'</div>';
}

function poTotals(po){const sub=(po.items||[]).reduce((a,i)=>a+(Number(i.qty)||0)*(Number(i.price)||0),0);const tax=Math.round(sub*(Number(po.tax)||0)/100);return {sub:sub,tax:tax,total:sub+tax};}
function allPOs(){const out=[];DB.projects.forEach(p=>{if(draft&&draft.id===p.id)return;(p.pos||[]).forEach(o=>out.push(o));});if(draft)(draft.pos||[]).forEach(o=>out.push(o));return out;}
function nextPONo(patOv){
  let pat=(patOv||DB.settings.po.pattern||'{NNN}/PO/{RM}/{YYYY}');if(pat.indexOf('{NNN}')<0)pat+='/{NNN}';
  const n=new Date(),Y=String(n.getFullYear()),M=String(n.getMonth()+1).padStart(2,'0');
  const base=pat.replace(/\{YYYY\}/g,Y).replace(/\{YY\}/g,Y.slice(2)).replace(/\{MM\}/g,M).replace(/\{RM\}/g,ROMAN[n.getMonth()]);
  const i=base.indexOf('{NNN}'),pre=base.slice(0,i),post=base.slice(i+5);
  const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp('^'+rx(pre)+'(\\d+)'+rx(post)+'$');
  let mx=0;allPOs().forEach(o=>{const m=re.exec(o.no||'');if(m)mx=Math.max(mx,parseInt(m[1],10));});
  return pre+String(mx+1).padStart(3,'0')+post;
}

function getL(ignoreStatus){
  const q=F.q.toLowerCase();
  return DB.projects.filter(p=>{
    if(F.cat&&p.category!==F.cat)return false;
    if(!ignoreStatus&&F.status&&effStatus(p)!==F.status)return false;
    if(F.pic&&p.pic!==F.pic)return false;
    if(q){const hay=[p.code,p.name,p.pic,p.vendor,p.po,p.area].concat(quotes(p).map(x=>x.vendor+' '+x.no)).concat((p.pos||[]).map(o=>o.no+' '+o.vendor)).concat((p.stages||[]).map(s=>s.name)).join(' ').toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
}

function donut(data,onclick,centerTxt){
  const tot=data.reduce((a,d)=>a+d.v,0),R=50,C=2*Math.PI*R;let off=0;
  const segs=tot?data.filter(d=>d.v>0).map(d=>{const len=d.v/tot*C;const s=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${d.c}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"></circle>`;off+=len;return s;}).join(''):`<circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--line)" stroke-width="20"></circle>`;
  const leg=data.map(d=>`<div onclick="${onclick}('${esc(d.l)}')"><i style="background:${d.c}"></i>${esc(d.l)}<b>${d.v}</b></div>`).join('');
  return `<div class="donut"><svg viewBox="0 0 140 140">${segs}<text x="70" y="68" text-anchor="middle" font-size="26" font-weight="700" fill="var(--text)">${tot}</text><text x="70" y="86" text-anchor="middle" font-size="10" fill="var(--muted)">${centerTxt}</text></svg><div class="leg">${leg}</div></div>`;
}

function attention(L){
  const t=today(),out=[];
  L.forEach(p=>{
    const st=effStatus(p);if(st==='Completed')return;
    const e=pd(p.end),dl=e?diffDays(t,e):null;
    if(st==='Delayed')out.push({p:p,sev:1,tag:'Terlambat',c:'#ef4444',txt:(e?Math.max(0,-dl)+' hari lewat target':'Ditandai terlambat')+' · progres '+p.progress+'%'});
    else if(atRisk(p))out.push({p:p,sev:2,tag:'Berisiko',c:'#f97316',txt:'Progres '+p.progress+'% vs rencana '+planned(p)+'%'});
    else if(st==='On Hold')out.push({p:p,sev:4,tag:'On Hold',c:'#f59e0b',txt:p.desc?p.desc:'Project ditunda'});
    else if(dl!==null&&dl>=0&&dl<=14)out.push({p:p,sev:5,tag:'Deadline',c:'#3b82f6',txt:dl+' hari lagi · progres '+p.progress+'%'});
    const ds=p.stages.filter(s=>stEff(s)==='Delayed');
    if(ds.length)out.push({p:p,sev:1.5,tag:'Stage',c:'#ef4444',txt:'Terlambat: '+ds.slice(0,3).map(s=>s.name+' (+'+stDev(s)+' hr)').join(', ')+(ds.length>3?' ...':'')});
    const ls=p.stages.filter(stLateStart);
    if(ls.length)out.push({p:p,sev:3,tag:'Belum mulai',c:'#f97316',txt:'Lewat plan mulai: '+ls.slice(0,3).map(s=>s.name).join(', ')+(ls.length>3?' ...':'')});
    if(useBud()){const bs=budgetState(p);if(bs.key==='over')out.push({p:p,sev:2,tag:'Over Budget',c:'#ef4444',txt:'+'+moneyC(bs.c.amt-p.budget)+' dari budget ('+bs.c.src.toLowerCase()+')'});}
    if(!selQ(p)){quotes(p).forEach(q=>{if(q.status!=='Ditolak'&&q.valid){const d=diffDays(t,pd(q.valid));if(d>=0&&d<=7)out.push({p:p,sev:3,tag:'Quotation',c:'#a855f7',txt:'Quotation '+q.vendor+' berlaku '+d+' hari lagi'});}});}
    if(selQ(p)&&!p.pos.length)out.push({p:p,sev:4,tag:'PO',c:'#a855f7',txt:'Quotation '+selQ(p).vendor+' terpilih, PO belum dibuat'});
  });
  return out.sort((a,b)=>a.sev-b.sev);
}
function priorityReminders(projects){
  const start=today(),end=RPERIOD==='day'?start:RPERIOD==='week'?addDays(start,6):new Date(start.getFullYear(),start.getMonth()+1,0);
  const out=[];projects.forEach(p=>{
    if(effStatus(p)==='On Hold')return;
    const add=(date,label,tab,done)=>{if(!date||done)return;const d=pd(date);if(!d||d>end)return;out.push({p,date,label,tab,days:diffDays(start,d)});};
    if(effStatus(p)!=='Completed')add(p.end,'Target project','info',false);
    (p.stages||[]).forEach(s=>{const status=stEff(s);if(status!=='On Hold')add(s.pf,'Stage: '+s.name,'stage',status==='Completed');});
    (p.milestones||[]).forEach(m=>add(m.date,'Milestone: '+m.name,'ms',m.done));
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date)||(a.p.name||'').localeCompare(b.p.name||''));
}
function setReminderPeriod(period){RPERIOD=period;rDash();applyLanguage();}
function togglePriorityReminders(){PRIORITY_COLLAPSED=!PRIORITY_COLLAPSED;rDash();applyLanguage();}

  const dashboardImprovements=(DB.improvements||[]).filter(x=>canReviewImprovement()||x.submittedBy===ME);
  const newImprovements=dashboardImprovements.filter(x=>x.status==='Baru').length;
  const nQ=L.reduce((a,p)=>a+quotes(p).length,0),nPO=L.reduce((a,p)=>a+p.pos.length,0);
  const waitQ=L.filter(p=>{const s=effStatus(p);return s!=='Completed'&&s!=='On Hold'&&s!=='Not Started'&&!quotes(p).length&&!p.pos.length;}).length;

function segments(rs,reEx,unit){
  const out=[];let c=new Date(rs);
  while(c<reEx){
    let n;
    if(unit==='month')n=new Date(c.getFullYear(),c.getMonth()+1,1);
    else if(unit==='year')n=new Date(c.getFullYear()+1,0,1);
    else if(unit==='quarter')n=new Date(c.getFullYear(),(Math.floor(c.getMonth()/3)+1)*3,1);
    else n=addDays(c,((8-c.getDay())%7)||7);
    if(n>reEx)n=reEx;
    out.push({s:new Date(c),e:n});c=n;
  }
  return out;
}
function setScale(s){GS=s;GJUMP=true;render();}
function jumpToday(){GJUMP=true;render();}
let GEXP={},GCMP=true;
function togX(id){GEXP[id]=!GEXP[id];render();}
function expAll(v){GEXP={};if(v)getL(false).forEach(p=>{if(p.stages.length)GEXP[p.id]=true;});render();}

    ${anyS?`<label style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--text)"><input type="checkbox" style="width:auto;margin:0" ${GCMP?'checked':''} onchange="GCMP=this.checked;render()"> Plan vs Actual</label><button class="btn sm" onclick="expAll(true)">Buka semua stage</button><button class="btn sm" onclick="expAll(false)">Tutup semua</button>`:''}

  if(!L.length){$('#main').innerHTML=tool+'<div class="card empty">Tidak ada project untuk ditampilkan.</div>';return;}
  const old=$('#gs'),sl=old?old.scrollLeft:0,stp=old?old.scrollTop:0;
  const dw={week:18,month:5,quarter:1.8}[GS],LW=270;
  const t=today();
  let mn=pd(L[0].start),mx=pd(L[0].end);
  const ext=d=>{d=pd(d);if(!d)return;if(d<mn)mn=d;if(d>mx)mx=d;};
  L.forEach(p=>{ext(p.start);ext(p.end);p.stages.forEach(s=>{ext(s.ps);ext(s.pf);ext(s.as);ext(s.af);});});
  if(t<mn)mn=t;if(t>mx)mx=t;
  const rs=new Date(mn.getFullYear(),mn.getMonth(),1),reEx=new Date(mx.getFullYear(),mx.getMonth()+2,1);
  const W=Math.round(diffDays(rs,reEx)*dw);
  const x=d=>Math.round(diffDays(rs,d)*dw*100)/100;
  const topU=GS==='week'?'month':'year',botU=GS==='week'?'week':(GS==='month'?'month':'quarter');
  const lbl=(s,u)=>u==='month'?(GS==='week'?s.toLocaleDateString('id-ID',{month:'long',year:'numeric'}):s.toLocaleDateString('id-ID',{month:'short'})):u==='year'?String(s.getFullYear()):u==='quarter'?'Q'+(Math.floor(s.getMonth()/3)+1):String(s.getDate());
  const top=segments(rs,reEx,topU).map(g=>`<div class="gseg t" style="left:${x(g.s)}px;width:${x(g.e)-x(g.s)}px">${lbl(g.s,topU)}</div>`).join('');
  const botSeg=segments(rs,reEx,botU);
  const bot=botSeg.map(g=>`<div class="gseg b" style="left:${x(g.s)}px;width:${x(g.e)-x(g.s)}px">${lbl(g.s,botU)}</div>`).join('');
  const lines=botSeg.map(g=>`<div style="left:${x(g.s)}px"></div>`).join('');
  const tx=x(t)+dw/2;
  const span=(a,b)=>{const l=x(a);return [l,Math.max(x(addDays(b,1))-l,5)];};
  const row=p=>{
    const st=effStatus(p),col=catColor(p.category),s=pd(p.start),e=pd(p.end),cs=curStage(p);
    const left=x(s),width=Math.max(x(addDays(e,1))-left,8);

    const ms=(p.milestones||[]).filter(m=>m.date).map(m=>`<div class="gms ${m.done?'done':''}" style="left:${x(pd(m.date))+dw/2-6}px" title="${esc(m.name+' · '+fmtDate(m.date))}"></div>`).join('');
    const tg=p.stages.length?`<span class="gx" onclick="event.stopPropagation();togX('${p.id}')" title="Buka / tutup stage">${GEXP[p.id]?'▾':'▸'}</span>`:'<span class="gx"></span>';
    return `<div class="grow"><div class="gl" onclick="openP('${p.id}')">${tg}<span class="dot" style="background:${ST_COLOR[st]}"></span><div><div class="gn">${esc(p.name)}</div><div class="gs">${esc(p.code)} · ${cs?esc(cs.txt):esc(p.pic||'-')}</div></div></div>
      <div class="gt" style="width:${W}px"><div class="${cls}" style="left:${left}px;width:${width}px;background:${col}33;border-color:${col}" title="${esc(ttl)}" onclick="openP('${p.id}')"><div style="width:${p.progress}%;background:${col}"></div></div><span class="gpct" style="left:${left+width+6}px">${p.progress}%</span>${ms}</div></div>`;
  };
  const srow=(p,s)=>{
    const e=stEff(s),sc=ST_COLOR[e],ps=pd(s.ps),pf=pd(s.pf),as=pd(s.as),af=pd(s.af),dv=stDev(s);

      if(ps&&pf){const sp=span(ps,pf);bars+=`<div class="gsp ${late?'late':''}" style="left:${sp[0]}px;width:${sp[1]}px;top:5px;height:10px" title="Plan ${esc(fmtDate(s.ps)+' - '+fmtDate(s.pf))}"></div>`;right=Math.max(right,sp[0]+sp[1]);}
      if(as){const end=af||(t>as?t:as);const sp=span(as,end);bars+=`<div class="gsa ${af?'':'run'}" style="left:${sp[0]}px;width:${sp[1]}px;top:19px;height:10px;background:${sc}" onclick="openP('${p.id}','stage')" title="Actual ${esc(fmtDate(s.as)+' - '+(s.af?fmtDate(s.af):'berjalan'))}"></div>`;right=Math.max(right,sp[0]+sp[1]);}
    }else{
      if(as){const end=af||(t>as?t:as);const sp=span(as,end);bars+=`<div class="gsa ${af?'':'run'}" style="left:${sp[0]}px;width:${sp[1]}px;top:11px;height:14px;background:${sc}" onclick="openP('${p.id}','stage')" title="Actual ${esc(fmtDate(s.as)+' - '+(s.af?fmtDate(s.af):'berjalan'))}"></div>`;right=sp[0]+sp[1];}

    }
    const dtxt=dv===null?'':(dv>0?`<span class="gdev" style="left:${right+6}px;top:${GCMP?12:11}px;color:var(--bad)">+${dv} hr</span>`:dv<0?`<span class="gdev" style="left:${right+6}px;top:${GCMP?12:11}px;color:var(--ok)">${dv} hr</span>`:'');
    const docCount=(s.attachments||[]).length+(s.docLinks||[]).length,docs=docCount?`<button class="gdoc" title="Lihat dokumentasi stage" aria-label="Lihat ${docCount} dokumentasi ${esc(s.name||'stage')}" onclick="event.stopPropagation();viewStageDocs('${p.id}','${s.id}')">📎 ${docCount}</button>`:'';

  };
  const groups=GGROUP?cats.map(c=>({name:c.name,items:L.filter(p=>p.category===c.name)})).filter(g=>g.items.length):[{name:null,items:L}];
  let rows='';
  groups.forEach(g=>{
    if(g.name)rows+=`<div class="grow ghd"><div class="gl"><i style="background:${catColor(g.name)}"></i><b>${esc(g.name)}</b><span class="muted small">(${g.items.length})</span></div><div class="gt" style="width:${W}px"></div></div>`;

    ${rows}<div class="glines" style="left:${LW}px;width:${W}px">${lines}<div class="today" style="left:${tx}px"></div></div></div></div>`;
  const sc=$('#gs');
  if(GJUMP){sc.scrollLeft=Math.max(0,tx-(sc.clientWidth-LW)*0.3);sc.scrollTop=0;GJUMP=false;}else{sc.scrollLeft=sl;sc.scrollTop=stp;}
}

async function attachImprovementFiles(input){
  if(!canEditImprovement()||!IDRAFT)return;
  const target=IDRAFT;
  const files=Array.from(input.files||[]),allowed=/\.(png|jpe?g|gif|webp|pdf|docx?|xlsx?|pptx?|csv|txt)$/i;
  for(const file of files){
    if(file.size>FILE_MAX){toast('File terlalu besar (maksimal 100 MB).');continue;}
    if(!allowed.test(file.name)){toast('Format yang didukung: gambar, PDF, Word, Excel, PowerPoint, CSV, atau TXT.');continue;}
    toast('Mengunggah '+file.name+' ...');
    try{
      const prefix='IMP-'+target.id;
      const uploaded=await api('/api/files',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Filename':encodeURIComponent(file.name),'X-Prefix':encodeURIComponent(prefix)},body:file});
      target.attachments.push({id:uid(),name:file.name,file:uploaded.name,size:uploaded.size||file.size,type:file.type||uploaded.mime_type||''});
      toast('Lampiran tersimpan di server');
    }catch(e){toast('Gagal mengunggah lampiran: '+e.message);}
  }
  input.value='';if(IDRAFT===target)refreshImpView();
}

function addImprovementLink(){
  if(!canEditImprovement()||!IDRAFT)return;
  const title=$('#imp_link_title').value.trim(),url=$('#imp_link_url').value.trim();
  const web=/^https?:\/\//i.test(url),network=url.startsWith('\\\\')||url.startsWith('//');
  if(!title||!url){toast('Isi judul dan link terlebih dahulu.');return;}
  if(!web&&!network){toast('Gunakan link http/https atau path jaringan \\\\server\\folder.');return;}
  if(web){try{const parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol))throw new Error();}catch(e){toast('Link web tidak valid.');return;}}
  IDRAFT.links.push({id:uid(),title:title,url:url});refreshImpView();
}
function removeImprovementLink(id){if(!canEditImprovement()||!IDRAFT)return;IDRAFT.links=IDRAFT.links.filter(link=>link.id!==id);refreshImpView();}

async function saveImprovement(){
  const x=IDRAFT;if(!x)return;
  if(!canEditImprovement()&&!canReviewImprovement()){toast('Anda tidak memiliki akses untuk mengubah improvement ini.');return;}
  if(!x.title.trim()||!x.department.trim()||!x.issue.trim()||!x.background.trim()||!x.purpose.trim()||!x.goals.trim()){toast('Lengkapi judul, departemen, issue, background, purpose, dan goals.');return;}
  if(x.decision==='Suggestion Only'&&(!x.piReason.trim()||!x.piSuggestion.trim())){toast('Isi alasan dan saran alternatif untuk keputusan tanpa project.');return;}
  if(x.status==='Tidak Perlu Improvement'&&!x.piReason.trim()){toast('Isi alasan tidak dilanjutkan sebagai improvement.');return;}
  const now=Math.max(Date.now(),(x.updatedAt||0)+1);x.updatedAt=now;x.updatedBy=ME;
  if(IISNEW){x.submittedBy=canReviewImprovement()?(x.submittedBy.trim()||ME):ME;x.submittedAt=now;}
  if(canReviewImprovement()&&IBASE&&VIEW==='imp_review_form'){
    ['title','department','submittedBy','submittedAt','type','issue','background','purpose','goals','savingMp','qualityMetric','attachments','links'].forEach(k=>{x[k]=IBASE[k];});
  }else if(!canReviewImprovement()){
    const protectedFields=['status','decision','piOwner','piFeedback','piSuggestion','piAction','piReason','feedbackLog','projectId'];
    if(IBASE)protectedFields.forEach(k=>{x[k]=IBASE[k];});
    else{Object.assign(x,{status:'Baru',decision:'Pending',piOwner:'',piFeedback:'',piSuggestion:'',piAction:'',piReason:'',feedbackLog:[],projectId:''});}
  }
  const changedReview=canReviewImprovement()&&(!IBASE||['status','decision','piOwner','piFeedback','piSuggestion','piAction','piReason'].some(k=>String(IBASE[k]||'')!==String(x[k]||'')));
  if(changedReview)x.feedbackLog=(x.feedbackLog||[]).concat([{by:ME,at:now,status:x.status,decision:x.decision,feedback:x.piFeedback,suggestion:x.piSuggestion,action:x.piAction,reason:x.piReason}]);
  const index=DB.improvements.findIndex(v=>v.id===x.id);if(index<0)DB.improvements.push(x);else DB.improvements[index]=x;
  closeM2();await persist();viewImprovement(x.id);toast('Improvement tersimpan');
}
async function promoteImprovement(){
  if(!canReviewImprovement()){toast('Akun ini tidak memiliki akses untuk meneruskan improvement ke project.');return;}
  const x=IDRAFT;if(!x||x.decision!=='To Project'){toast('Pilih keputusan Lanjut ke Project terlebih dahulu.');return;}
  if(x.projectId){const p=byId(x.projectId);if(p)viewP(p.id);return;}
  const category=DB.settings.categories.find(c=>c.name.toLowerCase()==='improvement')?.name||DB.settings.categories[0]?.name||'Improvement';
  const template=(DB.settings.templates||[]).find(t=>t.category===category)|| (DB.settings.templates||[]).find(t=>/improvement/i.test(t.name));
  const project=normP({id:uid(),code:nextCode(),name:x.title,category,status:'Not Started',priority:'Medium',pic:x.submittedBy||ME,area:x.department,start:fd(today()),end:fd(addDays(today(),60)),desc:'Issue: '+x.issue+'\n\nBackground: '+x.background+'\n\nPurpose: '+x.purpose+'\n\nGoals: '+x.goals+'\n\nPI feedback: '+(x.piFeedback||'-')+'\n\nPI action: '+(x.piAction||'-'),stages:template?buildStages(template.stages,fd(today())):[],updatedAt:Date.now(),updatedBy:ME,log:[{by:ME,t:Date.now(),items:['Project dibuat dari improvement '+x.id]}]});
  applyAuto(project);DB.projects.push(project);x.projectId=project.id;x.status='Disetujui';x.updatedAt=Math.max(Date.now(),(x.updatedAt||0)+1);x.updatedBy=ME;x.feedbackLog=(x.feedbackLog||[]).concat([{by:ME,at:x.updatedAt,status:x.status,decision:'To Project',feedback:x.piFeedback,suggestion:x.piSuggestion,action:x.piAction,reason:x.piReason}]);
  const improvementIndex=DB.improvements.findIndex(v=>v.id===x.id);if(improvementIndex>=0)DB.improvements[improvementIndex]=x;
  closeM2();await persist();viewP(project.id);toast('Improvement dilanjutkan menjadi '+project.code);
}

async function quickStage(pid,sid,k,v){
  const cur=byId(pid);if(!cur||!canEdit()||!canModifyProj(cur))return;
  draft=JSON.parse(JSON.stringify(cur));
  baseAt=cur.updatedAt;isNew=false;PROJECT_READ_ONLY=false;
  setS(sid,k,v,true);
  applyAuto(draft);
  const items=diffLog(cur,draft);
  draft.log=(draft.log||[]).slice(-59);
  if(items.length)draft.log.push({t:Date.now(),by:ME||'-',items:items});
  draft.updatedAt=Math.max(Date.now(),(cur.updatedAt||0)+1);
  draft.updatedBy=ME||'-';
  DB.projects[DB.projects.indexOf(cur)]=draft;
  baseAt=draft.updatedAt;
  render();
  await persist();
}
async function quickMilestone(pid,mid,done){
  const cur=byId(pid);if(!cur||!canEdit()||!canModifyProj(cur))return;
  draft=JSON.parse(JSON.stringify(cur));
  const m=draft.milestones.find(x=>x.id===mid);if(!m)return;
  m.done=!!done;
  draft.updatedAt=Math.max(Date.now(),(cur.updatedAt||0)+1);
  draft.updatedBy=ME||'-';
  draft.log=(draft.log||[]).slice(-59);
  draft.log.push({t:Date.now(),by:ME||'-',items:[`Milestone ${m.done?'selesai':'dibuka kembali'}: ${m.name||'-'}`]});
  DB.projects[DB.projects.indexOf(cur)]=draft;
  baseAt=draft.updatedAt;
  render();
  await persist();
}

function diffLog(o,n){
  if(!o)return ['Project dibuat'];
  const L=[],f=(lb,a,b,fm)=>{if(String(a==null?'':a)!==String(b==null?'':b)){fm=fm||(x=>x);L.push(lb+': '+(fm(a)||'-')+' → '+(fm(b)||'-'));}};
  f('Status',o.status,n.status);f('Progres',o.progress,n.progress,x=>x+'%');f('Mulai',o.start,n.start,fmtDate);f('Target',o.end,n.end,fmtDate);f('PIC',o.pic,n.pic);
  f('Vendor utama',o.vendor,n.vendor);f('Budget',o.budget,n.budget,money);f('Aktual/PO',o.actual,n.actual,money);f('No. PO',o.po,n.po);
  const so=selQ(o),sn=selQ(n);
  if(o.quotations.length<n.quotations.length)L.push('Quotation ditambah ('+n.quotations.length+' total)');
  if(o.quotations.length>n.quotations.length)L.push('Quotation dihapus');
  if((so?so.id:'')!==(sn?sn.id:''))L.push('Quotation terpilih: '+(sn?sn.vendor+' '+poMoney(sn.amount,sn.currency):'-'));
  (n.pos||[]).forEach(x=>{if(!(o.pos||[]).some(y=>y.id===x.id))L.push('PO dibuat: '+x.no+' ('+x.vendor+')');});
  (o.pos||[]).forEach(x=>{if(!(n.pos||[]).some(y=>y.id===x.id))L.push('PO dihapus: '+x.no);});
  const om={};(o.stages||[]).forEach(s=>{om[s.id]=s;});let added=0;
  (n.stages||[]).forEach(s=>{const a=om[s.id];
    if(!a){added++;return;}
    if(!a.af&&s.af)L.push('Task selesai (100%): '+s.name+' ('+fmtDate(s.af)+')');
    else if(!a.as&&s.as)L.push('Task mulai: '+s.name+' ('+fmtDate(s.as)+')'+((stProg(s)>0&&stProg(s)<100)?' · '+stProg(s)+'%':''));
    else if(stProg(a)!==stProg(s))L.push('Progres task '+s.name+': '+stProg(a)+'% → '+stProg(s)+'%');
    else if(a.ps!==s.ps||a.pf!==s.pf)L.push('Jadwal plan diubah: '+s.name);
    else if(a.status!==s.status)L.push('Status task '+s.name+': '+a.status+' → '+s.status);
    else if(a.as!==s.as||a.af!==s.af)L.push('Tanggal actual diubah: '+s.name);
  });
  if(added)L.push(added+' stage ditambah');
  (o.stages||[]).forEach(s=>{if(!(n.stages||[]).some(x=>x.id===s.id))L.push('Stage dihapus: '+s.name);});
  if(!L.length&&JSON.stringify(o.quotations)!==JSON.stringify(n.quotations))L.push('Data quotation diperbarui');
  if(!L.length&&(JSON.stringify(o.milestones)!==JSON.stringify(n.milestones)||JSON.stringify(o.pos)!==JSON.stringify(n.pos)||JSON.stringify(o.stages)!==JSON.stringify(n.stages)||o.name!==n.name||o.desc!==n.desc||o.category!==n.category||o.area!==n.area||o.priority!==n.priority))L.push('Info project diperbarui');
  return L.slice(0,12);
}
async function saveProject(){

  const d=draft;
  if(!d.name.trim()){setWizStep(1);toast('Nama project wajib diisi');return;}
  applyAuto(d);
  if(!d.start||!d.end){setWizStep(1);toast('Tanggal mulai dan target wajib diisi');return;}
  if(d.end<d.start){setWizStep(1);toast('Target selesai tidak boleh sebelum tanggal mulai');return;}
  const bad=d.stages.find(s=>!s.name.trim());if(bad){setWizStep(2);toast('Ada stage tanpa nama. Isi nama atau hapus stage tersebut.');return;}
  const cur=byId(d.id);
  if(!isNew&&cur&&cur.updatedAt!==baseAt){
    if(!confirm('Project ini baru saja diubah oleh '+(cur.updatedBy||'pengguna lain')+' ('+fmtDT(cur.updatedAt)+'). Simpan dan timpa perubahan tersebut?'))return;
  }
  if(d.status==='Completed')d.progress=100;
  let renum='';
  const used={};DB.projects.forEach(p=>{if(p.id!==d.id)(p.pos||[]).forEach(o=>{used[o.no]=1;});});
  d.pos.forEach(o=>{if(used[o.no]){const old=o.no;o.no=nextPONo();if(d.po===old)d.po=o.no;renum+=old+' → '+o.no+' ';}used[o.no]=1;});
  const items=diffLog(isNew?null:cur,d);
  d.log=(d.log||[]).slice(-59);
  if(items.length)d.log.push({t:Date.now(),by:ME||'-',items:items});
  d.updatedAt=Math.max(Date.now(),(cur?cur.updatedAt:0)+1);d.updatedBy=ME||'-';
  if(cur)DB.projects[DB.projects.indexOf(cur)]=d;else DB.projects.push(d);
  if(!DB.settings.categories.some(c=>c.name===d.category))DB.settings.categories.push({name:d.category,color:PALETTE[DB.settings.categories.length%PALETTE.length]});
  closeModal();await persist();viewP(d.id);
  const dp=dupPOs();
  toast(dp.length?'Tersimpan, tetapi ada nomor PO ganda: '+dp.join(', ')+'. Perbaiki nomor PO tersebut.':(renum?'Tersimpan. Nomor PO diganti karena sudah dipakai: '+renum:'Tersimpan'));
}

function setS(id,k,v,quiet){
  const s=draft.stages.find(x=>x.id===id);if(!s)return;
  const t=fd(today());
  if(k==='days'){const n=Math.max(1,parseInt(v,10)||1);if(s.ps)s.pf=fd(addDays(pd(s.ps),n-1));}
  else if(k==='prog'){
    const n=Math.max(0,Math.min(100,Math.round(Number(v)||0)));
    s.prog=n;
    if(n===100){s.status='Completed';s.af=s.af||t;s.as=s.as||((s.ps&&s.ps<=s.af)?s.ps:s.af);}
    else if(n>0){s.status='On Progress';s.af='';s.as=s.as||t;}
    else{s.status='Not Started';s.as='';s.af='';}
  }
  else if(k==='status'){
    s.status=v;
    if(v==='Completed'){s.prog=100;s.af=s.af||t;s.as=s.as||((s.ps&&s.ps<=s.af)?s.ps:s.af);}
    else if(v==='Not Started'){s.prog=0;s.as='';s.af='';}
    else if(v==='On Progress'){if(!s.prog||s.prog>=100)s.prog=50;s.af='';s.as=s.as||t;}
    else if(v==='On Hold'){s.af='';}
  }
  else if(k==='af'){
    s.af=v;
    if(v){s.status='Completed';s.prog=100;if(!s.as)s.as=(s.ps&&s.ps<=v)?s.ps:v;}
    else{s.status=s.as?'On Progress':'Not Started';s.prog=s.as?50:0;}
  }
  else if(k==='as'){
    s.as=v;
    if(v&&s.status==='Not Started'){s.status='On Progress';if(!s.prog)s.prog=50;}
    if(!v&&!s.af&&s.status==='On Progress'){s.status='Not Started';s.prog=0;}
  }
  else s[k]=v;
  if((k==='pf'||k==='ps')&&s.ps&&s.pf&&s.pf<s.ps){if(k==='pf')toast('Plan selesai tidak boleh sebelum plan mulai');s.pf=s.ps;}
  if(quiet)return;
  applyAuto(draft);drawTab();
}

  st.push({id:uid(),name:'',pic:'',ps:ps,pf:fd(addDays(pd(ps),6)),as:'',af:'',status:'Not Started',prog:0,note:'',par:false});

function loadTpl(){

function loadImg(file,maxW,maxH,sig){return new Promise((res,rej)=>{
  if(!file||!/^image\/(png|jpeg)$/.test(file.type)){rej(new Error('File harus berupa gambar PNG atau JPG'));return;}
  if(file.size>6*1024*1024){rej(new Error('Ukuran gambar maksimal 6 MB'));return;}
  const fr=new FileReader();fr.onerror=()=>rej(new Error('Gagal membaca file'));
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('Gambar tidak dapat dibaca'));
    im.onload=()=>{
      const r=Math.min(1,maxW/im.width,maxH/im.height),w=Math.max(1,Math.round(im.width*r)),h=Math.max(1,Math.round(im.height*r));
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
      if(sig){const d=x.getImageData(0,0,w,h),a=d.data;for(let i=0;i<a.length;i+=4){const mn=Math.min(a[i],a[i+1],a[i+2]);if(mn>=235)a[i+3]=0;else if(mn>180)a[i+3]=Math.round(a[i+3]*(235-mn)/55);}x.putImageData(d,0,0);}
      res(c.toDataURL('image/png'));};
    im.src=fr.result;};
  fr.readAsDataURL(file);});}
function pickImg(kind,i){

}

function removeCat(index){
  const category=CD[index];if(!category)return;
  if(CD.length<2){toast('Minimal satu kategori harus tersisa');return;}
  const fallback=CD.find((item,i)=>i!==index&&item.name.trim());if(!fallback){toast('Isi nama kategori lain terlebih dahulu');return;}
  const oldName=category.orig||category.name.trim(),count=DB.projects.filter(p=>p.category===oldName||p.category===category.name.trim()).length;
  if(count&&!confirm('Hapus klasifikasi "'+category.name+'"? '+count+' project yang menggunakannya akan dipindahkan ke "'+fallback.name.trim()+'" saat pengaturan disimpan.'))return;
  CD.splice(index,1);drawCats();
}
async function saveSettings(){
  if(isAdmin()){
    const cds=CD.filter(c=>c.name.trim());
    if(!cds.length){toast('Minimal satu kategori');return;}
    const now=Date.now();
    const removed=DB.settings.categories.filter(old=>!CD.some(c=>c.orig===old.name)),fallback=cds[0].name.trim();
    removed.forEach(old=>{
      DB.projects.forEach(p=>{if(p.category===old.name){p.category=fallback;p.updatedAt=Math.max(now,(p.updatedAt||0)+1);p.updatedBy=ME;p.log=(p.log||[]).concat([{t:p.updatedAt,by:ME,items:['Klasifikasi '+old.name+' dihapus; dipindahkan ke '+fallback]}]);}});
      (DB.settings.templates||[]).forEach(t=>{if(t.category===old.name)t.category=fallback;});
    });
    cds.forEach(c=>{if(c.orig&&c.orig!==c.name.trim()){
      DB.projects.forEach(p=>{if(p.category===c.orig){p.category=c.name.trim();p.updatedAt=now;p.updatedBy=ME;}});
      (DB.settings.templates||[]).forEach(t=>{if(t.category===c.orig)t.category=c.name.trim();});
    }});
    DB.settings.categories=cds.map(c=>({name:c.name.trim(),color:c.color}));
    DB.settings.currency=$('#s_cur').value;DB.settings.settingsAt=now;
    DB.settings.appName=($('#s_app').value||'').trim()||'PI Project Management';
    DB.settings.useBudget=$('#s_ub').checked;DB.settings.autoProgress=$('#s_ap').checked;DB.settings.autoDates=$('#s_ad').checked;
  }
  const th=$('#s_theme').value;document.documentElement.dataset.theme=th;localStorage.setItem('pt_theme',th);
  closeModal();await persist();render();toast('Pengaturan tersimpan');
}
